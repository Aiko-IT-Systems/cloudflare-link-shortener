<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AITSYS Go</title><link rel="stylesheet" href="/src/ui.css"></head>
<body class="popup"><main><header><img src="/icons/icon.svg" alt=""><div><strong>AITSYS <i>GO</i></strong><small>Create a transparent short link</small></div><a href="options.html" title="Settings" aria-label="Settings">⚙</a></header><form id="link-form"><label>Destination URL<input id="destinationUrl" name="destinationUrl" type="url" required placeholder="https://example.com"></label><div class="grid"><label>Custom slug<input id="slug" name="slug" maxlength="64" placeholder="optional"></label><label>Fallback title<input id="title" name="title" maxlength="120" placeholder="optional"></label></div><details><summary>Link options</summary><label>Password<input id="password" name="password" type="password" maxlength="200" placeholder="optional"></label><label>Expiry (UTC ISO)<input id="expiresAt" name="expiresAt" placeholder="2026-12-31T23:59:00Z"></label><label class="check"><input id="suppressSocialPreview" type="checkbox"> Suppress social preview</label></details><details><summary>Manual preview metadata</summary><label>Embed title<input id="embedTitle" name="embedTitle" maxlength="120"></label><label>Embed description<textarea id="embedDescription" name="embedDescription" maxlength="240"></textarea></label><label>Embed image URL<input id="embedImageUrl" name="embedImageUrl" type="url"></label><label>Embed site name<input id="embedSiteName" name="embedSiteName" maxlength="80"></label></details><button type="submit">Create short link</button></form><output id="status" aria-live="polite"></output></main><script type="module" src="/src/popup.ts"></script></body>
</html>
