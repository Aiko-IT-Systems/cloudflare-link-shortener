name: Tools Release

on:
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/tools-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path tools -Filter *.ps1
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $null, [ref] $errors) | Out-Null
            if ($errors) {
              $errors | Format-List *
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
          }

      - name: Validate Bash scripts
        run: bash -n tools/short tools/short-admin

      - name: Package tools
        id: package-tools
        run: |
          version="tools-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          archive="aitsys-go-tools-${version}.zip"
          (cd tools && zip -r "../${archive}" .)
          echo "tools_version=${version}" >> "$GITHUB_OUTPUT"
          echo "tools_archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.package-tools.outputs.tools_version }}
          name: AITSYS GO Tools ${{ steps.package-tools.outputs.tools_version }}
          body: |
            Automated release for the AITSYS GO quick creation and admin tools.

            Set `AITSYS_SHORT_API_KEY` and `AITSYS_SHORT_API_BASE` in your environment before using them.
          files: ${{ steps.package-tools.outputs.tools_archive }}
