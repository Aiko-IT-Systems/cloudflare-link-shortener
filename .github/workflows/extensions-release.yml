name: Browser Extensions Release

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/check-extensions.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extensions-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run extensions:build
      - run: npm run extensions:check
      - id: package-extensions
        run: |
          version="extensions-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          chrome_archive="aitsys-go-chrome-${version}.zip"
          edge_archive="aitsys-go-edge-${version}.zip"
          firefox_archive="aitsys-go-firefox-${version}.zip"
          source_archive="aitsys-go-extension-source-${version}.zip"
          (cd extensions/dist/chrome && zip -r "../../../${chrome_archive}" .)
          (cd extensions/dist/edge && zip -r "../../../${edge_archive}" .)
          (cd extensions/dist/firefox && zip -r "../../../${firefox_archive}" .)
          zip -r "${source_archive}" extensions -x "extensions/dist/*"
          unzip -Z1 "${source_archive}" | grep -qx "extensions/vite.config.ts"
          if unzip -Z1 "${source_archive}" | grep -q "^extensions/dist/"; then
            echo "::error::Source archive must not include generated extensions/dist output."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "chrome_archive=${chrome_archive}" >> "$GITHUB_OUTPUT"
          echo "edge_archive=${edge_archive}" >> "$GITHUB_OUTPUT"
          echo "firefox_archive=${firefox_archive}" >> "$GITHUB_OUTPUT"
          echo "source_archive=${source_archive}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.package-extensions.outputs.version }}
          name: AITSYS Go Browser Extensions ${{ steps.package-extensions.outputs.version }}
          body: |
            Automated unsigned Chrome, Microsoft Edge, and Firefox ZIP packages, plus editable extension source.

            Configure each extension with a revocable issued user token; never use the master administrator token.
          files: |
            ${{ steps.package-extensions.outputs.chrome_archive }}
            ${{ steps.package-extensions.outputs.edge_archive }}
            ${{ steps.package-extensions.outputs.firefox_archive }}
            ${{ steps.package-extensions.outputs.source_archive }}
