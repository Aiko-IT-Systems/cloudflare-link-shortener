name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Worker and extensions
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Worker tests
        run: npm test

      - name: Typecheck Worker and shared code
        run: npm run typecheck

      - name: Build browser extensions
        run: npm run extensions:build

      - name: Validate extension manifests and output
        run: npm run extensions:check

      - name: Validate distributable shell cli
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src/cli -Filter *.ps1
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref] $null, [ref] $errors) | Out-Null
            if ($errors) {
              $errors | Format-List *
              throw "PowerShell syntax check failed for $($file.FullName)"
            }
          }

      - name: Validate Bash cli
        run: bash -n src/cli/short src/cli/short-admin

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Pull request validation"
            echo
            echo "- Worker tests"
            echo "- TypeScript typecheck"
            echo "- Chrome, Edge, and Firefox extension builds"
            echo "- Extension manifest validation"
            echo "- PowerShell cli syntax validation"
            echo "- Bash cli syntax validation"
          } >> "$GITHUB_STEP_SUMMARY"
