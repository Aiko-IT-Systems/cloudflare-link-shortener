name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: codeql-${{ github.workflow }}-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: javascript-typescript
            build_mode: none
          - language: java-kotlin
            build_mode: manual

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Ensure Gradle wrapper is executable
        if: matrix.language == 'java-kotlin'
        run: chmod +x src/android/gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended

      - name: Compile Android for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: src/android
        run: ./gradlew --no-daemon :app:clean :app:compileDebugKotlin

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

      - name: Write analysis summary
        if: always()
        run: |
          {
            echo "## CodeQL: ${{ matrix.language }}"
            echo
            echo "- **Build mode:** \`${{ matrix.build_mode }}\`"
            echo "- **Result:** \`${{ job.status }}\`"
            if [ "${{ matrix.language }}" = "java-kotlin" ]; then
              echo "- **Android trace:** \`src/android :app:compileDebugKotlin\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
