name: Feature request
description: Suggest an improvement to AITSYS Go.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, private URLs, or unpublished security details. Use the private Security vulnerability reports link for security reports.
  - type: dropdown
    id: component
    attributes:
      label: Relevant component
      multiple: true
      options:
        - Worker public redirect or privacy page
        - REST API, accounts, or user tokens
        - Discord interactions or commands
        - Chrome extension
        - Microsoft Edge extension
        - Firefox extension
        - Android app
        - PowerShell or Bash tools
        - GitHub Actions or release artifacts
        - Branding assets
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      placeholder: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      placeholder: Describe the behavior that would make this successful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "Optional: workarounds or other approaches."
